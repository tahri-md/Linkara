services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: linkara-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkara_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkara-network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: linkara-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkara-network

  # Docker DinD (Docker-in-Docker) for running jobs
  docker-dind:
    image: docker:dind
    container_name: linkara-docker
    privileged: true
    ports:
      - "2375:2375"
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker_data:/var/lib/docker
    networks:
      - linkara-network

  # Backend (Node.js/TypeScript API + BullMQ worker) - PROD IMAGE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linkara-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: linkara_dev
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCKER_HOST: http://docker-dind:2375
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-dind:
        condition: service_started
    networks:
      - linkara-network
    # NOTE: no volumes here - dist/ + node_modules come from the built image only

  # Frontend (Next.js) - PROD IMAGE
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    container_name: linkara-frontend
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - linkara-network
    # NOTE: no volumes here - standalone server + static assets come from the built image only

volumes:
  postgres_data:
  redis_data:
  docker_data:

networks:
  linkara-network:
    driver: bridge