enum OrgRole {
  OWNER
  ADMIN
  EDITOR
  VIEWER
}

type Organization {
  id: ID!
  name: String!
  description: String
  slug: String!
  owner_id: ID!
  avatar_url: String
  created_at: String!
  members: [OrgMember!]!
}

type OrgMember {
  id: ID!
  organization_id: ID!
  user_id: ID!
  role: OrgRole!
  joined_at: String!
  user: User!
}

input CreateOrganizationInput {
  name: String!
  slug: String!
  description: String
  avatar_url: String
}

input AddOrgMemberInput {
  organizationId: ID!
  userId: ID!
  role: OrgRole!
}

input UpdateMemberRoleInput {
  organizationId: ID!
  userId: ID!
  role: OrgRole!
}

extend type Query {
  organizations: [Organization!]!
  organization(id: ID!): Organization
}

extend type Mutation {
  createOrganization(input: CreateOrganizationInput!): Organization!
  addOrgMember(input: AddOrgMemberInput!): OrgMember!
  updateMemberRole(input: UpdateMemberRoleInput!): OrgMember!
  removeMember(organizationId: ID!, userId: ID!): Boolean!
}
