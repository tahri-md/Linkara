type Secret {
  id: ID!
  org_id: ID!
  name: String!
  created_by: ID
  created_at: String!
  updated_at: String!
  accessed_at: String
}

type SecretAuditLog {
  id: ID!
  org_id: ID!
  user_id: ID
  action: String!
  resource_type: String
  resource_id: ID
  changes: String
  created_at: String!
}

type DeleteSecretResponse {
  success: Boolean!
  message: String!
}

input CreateSecretInput {
  name: String!
  value: String!
}

input UpdateSecretInput {
  value: String!
}

extend type Query {
  secrets(orgId: ID!): [Secret!]!
  secretAuditLogs(orgId: ID!, limit: Int): [SecretAuditLog!]!
}

extend type Mutation {
  createSecret(orgId: ID!, input: CreateSecretInput!): Secret!
  updateSecret(orgId: ID!, secretId: ID!, input: UpdateSecretInput!): Secret!
  deleteSecret(orgId: ID!, secretId: ID!): DeleteSecretResponse!
}