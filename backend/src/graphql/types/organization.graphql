enum OrgRole {
  OWNER
  ADMIN
  EDITOR
  VIEWER
}

type Organization {
  id: ID!
  name: String!
  description: String
  slug: String!
  owner_id: ID!
  avatar_url: String
  created_at: String!
  members: [OrgMember!]!
}

type OrgMember {
  id: ID!
  organization_id: ID!
  user_id: ID!
  role: OrgRole!
  joined_at: String!
  user: User!
}

input CreateOrganizationInput {
  name: String!
  slug: String!
  description: String
  avatar_url: String
}

input AddOrgMemberInput {
  organizationId: ID!
  userId: ID!
  role: OrgRole!
}

input UpdateMemberRoleInput {
  organizationId: ID!
  userId: ID!
  role: OrgRole!
}

extend type Query {
  organizations: [Organization!]!
  organization(id: ID!): Organization
  pendingInvites(organizationId: ID!): [OrgInvite!]!
}

extend type Mutation {
  createOrganization(input: CreateOrganizationInput!): Organization!
  inviteMember(input: InviteMemberInput!): OrgInvite!
  revokeInvite(organizationId: ID!, inviteId: ID!): Boolean!
  acceptInvite(token: String!): OrgMember!
  updateMemberRole(input: UpdateMemberRoleInput!): OrgMember!
  removeMember(organizationId: ID!, userId: ID!): Boolean!
}
enum InviteStatus {
  pending
  accepted
  revoked
  expired
}

type OrgInvite {
  id: ID!
  org_id: ID!
  email: String!
  role: OrgRole!
  status: InviteStatus!
  expires_at: String!
  created_at: String!
}

input InviteMemberInput {
  organizationId: ID!
  email: String!
  role: OrgRole!
}
